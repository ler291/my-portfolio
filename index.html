<!DOCTYPE html>
<html lang="tl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para sayo 💜</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            padding: 20px;
            overflow-x: hidden;
        }
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
       .container {
            max-width: 420px;
            width: 100%;
            position: relative;
            z-index: 10;
        }
       .card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 45px 35px;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
       .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 25px 70px rgba(0,0,0,0.4);
        }
       .emoji {
            font-size: 56px;
            margin-bottom: 20px;
            cursor: pointer;
            display: inline-block;
            transition: 0.3s;
            animation: float 3s ease-in-out infinite;
        }
       .emoji:hover {
            transform: scale(1.2) rotate(10deg);
        }
       .emoji:active {
            transform: scale(0.9);
        }
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }
        h1 {
            color: #1a1a1a;
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
        }
       .subtitle {
            color: #666;
            font-size: 14px;
            margin-bottom: 30px;
        }
       .letter {
            display: none;
            text-align: left;
            animation: slideUp 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
       .letter.show {
            display: block;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
       .letter p {
            color: #2c2c2c;
            line-height: 1.9;
            margin: 18px 0;
            font-size: 15px;
            min-height: 20px;
        }
       .name {
            background: linear-gradient(135deg, #e91e63, #9c27b0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 700;
        }
       .divider {
            width: 50px;
            height: 3px;
            background: linear-gradient(90deg, #e91e63, #9c27b0);
            margin: 25px auto;
            border-radius: 2px;
        }
       .btn {
            background: linear-gradient(135deg, #e91e63, #9c27b0);
            color: white;
            border: none;
            padding: 16px 36px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            margin-top: 15px;
            cursor: pointer;
            transition: 0.3s;
            width: 100%;
            box-shadow: 0 4px 15px rgba(233, 30, 99, 0.4);
        }
       .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(233, 30, 99, 0.6);
        }
       .btn:active {
            transform: scale(0.98);
        }
       .signature {
            text-align: right;
            margin-top: 30px;
            color: #666;
            font-size: 14px;
            font-style: italic;
        }
       .reply {
            display: none;
            margin-top: 25px;
            padding: 20px;
            background: linear-gradient(135deg, #ffeaa7, #fdcb6e);
            border-radius: 16px;
            color: #d63031;
            font-weight: 600;
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
       .reply.show {
            display: block;
        }
        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
       .hint {
            color: #999;
            font-size: 13px;
            margin-top: 15px;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }
       .heart-particle {
            position: fixed;
            font-size: 20px;
            opacity: 0;
            animation: floatUp 4s ease-out forwards;
            pointer-events: none;
            z-index: 1;
        }
        @keyframes floatUp {
            0% { transform: translateY(0) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            100% { transform: translateY(-100vh) rotate(360deg); opacity: 0; }
        }
       .typing::after {
            content: '|';
            animation: blink 1s infinite;
        }
        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="emoji" id="emoji" onclick="revealLetter()">💌</div>
            <h1>Hi, <span class="name">Crush</span></h1>
            <p class="subtitle" id="subtitle">May sasabihin ako sayo...</p>

            <div class="letter" id="letter">
                <div class="divider"></div>
                <p id="p1"></p>
                <p id="p2"></p>
                <p id="p3"></p>
                <p id="p4"></p>
                <p id="p5" style="font-weight: 600; color: #1a1a1a;"></p>

                <div class="signature">
                    — Yung naghihintay sayo 💜
                </div>

                <button class="btn" id="replyBtn" onclick="showReply()" style="display:none;">
                    Na-miss mo din ba ako? 🥺
                </button>

                <div class="reply" id="reply">
                    Alam ko naman eh 😌<br>
                    Chat mo na ko dali. Miss na rin kita.
                </div>
            </div>

            <p class="hint" id="hint">Tap mo yung 💌</p>
        </div>
    </div>

    <script>
        let revealed = false;
        const messages = [
            "Alam kong LDR tayo at ang hirap. Minsan naiisip ko kung worth it ba lahat ng paghihintay, ng pagka-miss, ng mga gabing mag-isa ako.",
            "Pero tuwing nakakausap kita, tuwing tumatawa ka sa mga corny jokes ko, tuwing sinasabi mong \"ingat ka\" bago matulog...",
            "Doon ko naaalala kung bakit kita pinipili araw-araw.",
            "Kasi ikaw yung taong kahit malayo, nararamdaman kong nasa tabi ko. Ikaw yung peace ko sa magulong mundo.",
            "Kaya kahit ilang kilometro pa yan, kahit gaano pa katagal... Ikaw pa rin. Lagi."
        ];

        function revealLetter() {
            if (revealed) return;
            revealed = true;

            document.getElementById('emoji').textContent = '💜';
            document.getElementById('subtitle').style.display = 'none';
            document.getElementById('hint').style.display = 'none';
            document.getElementById('letter').classList.add('show');

            // Floating hearts effect
            createHearts();

            // Typewriter effect
            typeWriter(0);
        }

        function typeWriter(index) {
            if (index >= messages.length) {
                document.getElementById('replyBtn').style.display = 'block';
                return;
            }

            const p = document.getElementById('p' + (index + 1));
            const text = messages[index];
            let i = 0;
            p.classList.add('typing');

            const interval = setInterval(() => {
                if (i < text.length) {
                    p.textContent += text.charAt(i);
                    i++;
                } else {
                    clearInterval(interval);
                    p.classList.remove('typing');
                    setTimeout(() => typeWriter(index + 1), 300);
                }
            }, 25);
        }

        function createHearts() {
            for (let i = 0; i < 20; i++) {
                setTimeout(() => {
                    const heart = document.createElement('div');
                    heart.className = 'heart-particle';
                    heart.innerHTML = ['💜','💕','❤️','💖','✨'][Math.floor(Math.random()*5)];
                    heart.style.left = Math.random() * 100 + 'vw';
                    heart.style.animationDelay = Math.random() * 2 + 's';
                    heart.style.fontSize = Math.random() * 10 + 15 + 'px';
                    document.body.appendChild(heart);
                    setTimeout(() => heart.remove(), 4000);
                }, i * 150);
            }
        }

        function showReply() {
            document.getElementById('reply').classList.add('show');
            createHearts();
        }
    </script>
</body>
</html>
